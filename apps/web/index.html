<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momma Mia Catering - Your Meals & More</title>
    <meta
      name="description"
      content="Discover exceptional catering services and delicious meals with Momma Mia Catering. A food knowledge sharing community."
    />
    <!-- Every photo on the site comes from Supabase Storage; warming the
         connection here saves the DNS + TLS round trips off the first image. -->
    <link rel="preconnect" href="https://fbzwicfvhrtyfqjounvo.supabase.co" crossorigin />
    <!-- Twice on purpose: the crossorigin one warms the connection the REST
         calls reuse; plain <img> fetches are no-cors and need their own. -->
    <link rel="preconnect" href="https://fbzwicfvhrtyfqjounvo.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
